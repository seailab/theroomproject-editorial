name: Publish The Room Project
on:
  push:
    branches: [main]
    paths:
      - theroomproject-editorial.zip
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify and unpack the approved website
        run: |
          echo '622b72c161d63b369e17ea086b0c58630273bf34421615a8e01aa333d2ca0f4e  theroomproject-editorial.zip' | sha256sum --check
          mkdir -p _site
          unzip -q theroomproject-editorial.zip -d _site
          test -f _site/index.html
          test -f _site/assets/exhibition.css
          test -f _site/assets/fonts/saira-latin.woff2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
